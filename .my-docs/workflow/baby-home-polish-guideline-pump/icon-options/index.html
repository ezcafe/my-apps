<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pump icon options</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
        background: #f6f6f6;
        color: #111;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      .hint {
        font-size: 13px;
        color: #555;
        margin: 0 0 16px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
      }
      figure {
        margin: 0;
        padding: 16px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 12px;
        text-align: center;
      }
      img {
        width: 140px;
        height: 140px;
        object-fit: contain;
        background: #fff;
      }
      figcaption {
        margin-top: 12px;
        font-size: 14px;
        font-weight: 600;
      }
      p {
        margin: 6px 0 0;
        font-size: 12px;
        font-weight: 400;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>Breast pump bottle icons — reply with a letter</h1>
    <p class="hint">A–M earlier · N–W new · total 23 options</p>
    <div class="grid">
      <figure>
        <img src="./pump-icon-a-wide-shield.png" alt="Option A" />
        <figcaption>A — Wide shield + bottle</figcaption>
        <p>Curved flange, short neck, milk line</p>
      </figure>
      <figure>
        <img src="./pump-icon-b-cone-handle.png" alt="Option B" />
        <figcaption>B — Cone + handle (was current)</figcaption>
        <p>Triangle flange, bottle, side handle</p>
      </figure>
      <figure>
        <img src="./pump-icon-c-oval-motor.png" alt="Option C" />
        <figcaption>C — Oval flange + motor</figcaption>
        <p>Tilted oval shield, volume marks, knob</p>
      </figure>
      <figure>
        <img src="./pump-icon-d-trumpet-funnel.png" alt="Option D" />
        <figcaption>D — Trumpet funnel + droplet</figcaption>
        <p>Funnel flange, screw rings, droplet</p>
      </figure>
      <figure>
        <img src="./pump-icon-e-side-by-side.png" alt="Option E" />
        <figcaption>E — Side-by-side shield + bottle</figcaption>
        <p>C-flange left, bottle + droplet right</p>
      </figure>
      <figure>
        <img src="./pump-icon-f-bulb-manual.png" alt="Option F" />
        <figcaption>F — Manual bulb pump</figcaption>
        <p>Round squeeze bulb on top of bottle</p>
      </figure>
      <figure>
        <img src="./pump-icon-g-cup-shield.png" alt="Option G" />
        <figcaption>G — Cup shield + droplet</figcaption>
        <p>U-cup flange, screw ring, milk drop</p>
      </figure>
      <figure>
        <img src="./pump-icon-h-motor-box.png" alt="Option H" />
        <figcaption>H — Electric motor box</figcaption>
        <p>Motor unit + hose into bottle</p>
      </figure>
      <figure>
        <img src="./pump-icon-i-flared-bottle.png" alt="Option I" />
        <figcaption>I — Flared bottle</figcaption>
        <p>Trumpet top instead of nipple, milk line</p>
      </figure>
      <figure>
        <img src="./pump-icon-j-dual-flange.png" alt="Option J" />
        <figcaption>J — Dual flange</figcaption>
        <p>Two shields sharing one bottle</p>
      </figure>
      <figure>
        <img src="./pump-icon-k-lever-pump.png" alt="Option K" />
        <figcaption>K — Lever / hospital pump</figcaption>
        <p>Angled flange + lever handle + bottle</p>
      </figure>
      <figure>
        <img src="./pump-icon-l-abstract-drop.png" alt="Option L" />
        <figcaption>L — Abstract drop mark</figcaption>
        <p>Ultra-minimal drop + bottle silhouette</p>
      </figure>
      <figure>
        <img src="./pump-icon-m-ring-flange.png" alt="Option M" />
        <figcaption>M — Ring flange</figcaption>
        <p>Donut flange ring, ticks, milk line</p>
      </figure>
      <figure>
        <img src="./pump-icon-n-mushroom-flange.png" alt="Option N" />
        <figcaption>N — Mushroom flange</figcaption>
        <p>Soft mushroom shield, slim bottle</p>
      </figure>
      <figure>
        <img src="./pump-icon-o-wearable-pod.png" alt="Option O" />
        <figcaption>O — Wearable pod</figcaption>
        <p>Compact oval pod with nested bottle</p>
      </figure>
      <figure>
        <img src="./pump-icon-p-hex-pump.png" alt="Option P" />
        <figcaption>P — Hex pump</figcaption>
        <p>Hexagon flange + hex bottle</p>
      </figure>
      <figure>
        <img src="./pump-icon-q-suction-arcs.png" alt="Option Q" />
        <figcaption>Q — Suction arcs</figcaption>
        <p>Flared bottle + vacuum arcs above</p>
      </figure>
      <figure>
        <img src="./pump-icon-r-d-handle.png" alt="Option R" />
        <figcaption>R — D-handle pump</figcaption>
        <p>Large D-handle, angled flange, bottle</p>
      </figure>
      <figure>
        <img src="./pump-icon-s-wing-flanges.png" alt="Option S" />
        <figcaption>S — Wing flanges</figcaption>
        <p>Two wing shields beside bottle neck</p>
      </figure>
      <figure>
        <img src="./pump-icon-t-target-stack.png" alt="Option T" />
        <figcaption>T — Target stack</figcaption>
        <p>Ring flange stacked on square bottle</p>
      </figure>
      <figure>
        <img src="./pump-icon-u-flask-tube.png" alt="Option U" />
        <figcaption>U — Flask + tube</figcaption>
        <p>Cup flange into round flask bottle</p>
      </figure>
      <figure>
        <img src="./pump-icon-v-scallop-flange.png" alt="Option V" />
        <figcaption>V — Scallop flange</figcaption>
        <p>Flower/scalloped silicone shield</p>
      </figure>
      <figure>
        <img src="./pump-icon-w-profile-horn.png" alt="Option W" />
        <figcaption>W — Profile horn</figcaption>
        <p>Side view: horn shield + motor bump</p>
      </figure>
    </div>
  </body>
</html>
