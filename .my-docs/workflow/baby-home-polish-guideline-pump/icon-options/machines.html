<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pumping machine icons</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
        background: #f6f6f6;
        color: #111;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      .hint {
        font-size: 13px;
        color: #555;
        margin: 0 0 16px;
      }
      a {
        color: #0f766e;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
      }
      figure {
        margin: 0;
        padding: 16px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 12px;
        text-align: center;
      }
      img {
        width: 140px;
        height: 140px;
        object-fit: contain;
        background: #fff;
      }
      figcaption {
        margin-top: 12px;
        font-size: 14px;
        font-weight: 600;
      }
      p {
        margin: 6px 0 0;
        font-size: 12px;
        font-weight: 400;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>Pumping machine icons — reply with PM1–PM18</h1>
    <p class="hint">
      Electric / machine-style pumps (not bottle-only). PM1–8 earlier · PM9–18 new.
      <a href="./index.html">Back to A–W bottle icons</a>
    </p>
    <div class="grid">
      <figure>
        <img src="./pump-machine-1-hospital.png" alt="PM1" />
        <figcaption>PM1 — Hospital pump</figcaption>
        <p>Motor base + buttons, tube to flange + bottle</p>
      </figure>
      <figure>
        <img src="./pump-machine-2-portable.png" alt="PM2" />
        <figcaption>PM2 — Portable unit</figcaption>
        <p>Rounded body, screen + button, hose + bottle</p>
      </figure>
      <figure>
        <img src="./pump-machine-3-dual.png" alt="PM3" />
        <figcaption>PM3 — Dual pump</figcaption>
        <p>Central motor, two flanges + two bottles</p>
      </figure>
      <figure>
        <img src="./pump-machine-4-box.png" alt="PM4" />
        <figcaption>PM4 — Box machine</figcaption>
        <p>Square device, power button, coil + flange</p>
      </figure>
      <figure>
        <img src="./pump-machine-5-wearable.png" alt="PM5" />
        <figcaption>PM5 — Wearable shell</figcaption>
        <p>Clamshell motor, integrated flange, no hose</p>
      </figure>
      <figure>
        <img src="./pump-machine-6-upright.png" alt="PM6" />
        <figcaption>PM6 — Upright Spectra-style</figcaption>
        <p>Tall unit with top handle, panel, tube left</p>
      </figure>
      <figure>
        <img src="./pump-machine-7-cylinder.png" alt="PM7" />
        <figcaption>PM7 — Cylinder motor</figcaption>
        <p>Motor cylinder + vacuum arcs + bottle</p>
      </figure>
      <figure>
        <img src="./pump-machine-8-dock.png" alt="PM8" />
        <figcaption>PM8 — Docking station</figcaption>
        <p>Base dock + head + flange + bottle</p>
      </figure>
      <figure>
        <img src="./pump-machine-9-backpack.png" alt="PM9" />
        <figcaption>PM9 — Backpack portable</figcaption>
        <p>Strap hint, panel, hose to flange</p>
      </figure>
      <figure>
        <img src="./pump-machine-10-slim-brick.png" alt="PM10" />
        <figcaption>PM10 — Slim brick</figcaption>
        <p>Phone-sized brick, USB-C, LED dots</p>
      </figure>
      <figure>
        <img src="./pump-machine-11-puck.png" alt="PM11" />
        <figcaption>PM11 — Puck motor</figcaption>
        <p>Round puck, bottle below, flange wing</p>
      </figure>
      <figure>
        <img src="./pump-machine-12-cart.png" alt="PM12" />
        <figcaption>PM12 — Hospital cart</figcaption>
        <p>Pole stand, motor box, dual bottles</p>
      </figure>
      <figure>
        <img src="./pump-machine-13-nightstand.png" alt="PM13" />
        <figcaption>PM13 — Nightstand appliance</figcaption>
        <p>LCD + dial, hose to flange</p>
      </figure>
      <figure>
        <img src="./pump-machine-14-bra-clip.png" alt="PM14" />
        <figcaption>PM14 — Bra-clip wearable</figcaption>
        <p>Capsule on bra arc, micro-bottle</p>
      </figure>
      <figure>
        <img src="./pump-machine-15-travel-case.png" alt="PM15" />
        <figcaption>PM15 — Travel case</figcaption>
        <p>Handle top, wheels, coiled hose</p>
      </figure>
      <figure>
        <img src="./pump-machine-16-wall-plug.png" alt="PM16" />
        <figcaption>PM16 — Wall-plug brick</figcaption>
        <p>Power prongs, hose to flange + bottle</p>
      </figure>
      <figure>
        <img src="./pump-machine-17-arm.png" alt="PM17" />
        <figcaption>PM17 — Articulated arm</figcaption>
        <p>Motor cube + tube arm + flange</p>
      </figure>
      <figure>
        <img src="./pump-machine-18-twin-towers.png" alt="PM18" />
        <figcaption>PM18 — Twin towers</figcaption>
        <p>Two bottles + center pad + flanges</p>
      </figure>
    </div>
  </body>
</html>
