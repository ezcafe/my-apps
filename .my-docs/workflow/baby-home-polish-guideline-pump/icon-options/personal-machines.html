<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personal pump machine icons</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
        background: #f6f6f6;
        color: #111;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      .hint {
        font-size: 13px;
        color: #555;
        margin: 0 0 16px;
      }
      a {
        color: #0f766e;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
      }
      figure {
        margin: 0;
        padding: 16px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 12px;
        text-align: center;
      }
      img {
        width: 140px;
        height: 140px;
        object-fit: contain;
        background: #fff;
      }
      figcaption {
        margin-top: 12px;
        font-size: 14px;
        font-weight: 600;
      }
      p {
        margin: 6px 0 0;
        font-size: 12px;
        font-weight: 400;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>Personal pump machine icons — reply with PM29–PM38</h1>
    <p class="hint">
      Personal / portable / single-user pumps (wearable, pocket, app).
      <a href="./home-machines.html">Home PM19–28</a>
      ·
      <a href="./machines.html">All machines PM1–18</a>
      ·
      <a href="./index.html">Bottle icons A–W</a>
    </p>
    <div class="grid">
      <figure>
        <img src="./pump-machine-29-handheld-remote.png" alt="PM29" />
        <figcaption>PM29 — Handheld remote</figcaption>
        <p>Palm remote, screen + buttons, one flange</p>
      </figure>
      <figure>
        <img src="./pump-machine-30-inbra-cup.png" alt="PM30" />
        <figcaption>PM30 — In-bra cup</figcaption>
        <p>Wearable cup + motor bump, hands-free</p>
      </figure>
      <figure>
        <img src="./pump-machine-31-necklace-fob.png" alt="PM31" />
        <figcaption>PM31 — Necklace fob</figcaption>
        <p>Cord loop controller, wireless to flange</p>
      </figure>
      <figure>
        <img src="./pump-machine-32-pocket-clip.png" alt="PM32" />
        <figcaption>PM32 — Pocket clip</figcaption>
        <p>Pager-style motor + belt clip + hose</p>
      </figure>
      <figure>
        <img src="./pump-machine-33-phone-app.png" alt="PM33" />
        <figcaption>PM33 — Phone app control</figcaption>
        <p>Phone + bluetooth arcs to personal brick</p>
      </figure>
      <figure>
        <img src="./pump-machine-34-wristband.png" alt="PM34" />
        <figcaption>PM34 — Wristband</figcaption>
        <p>Fitness-band controller + flange pod</p>
      </figure>
      <figure>
        <img src="./pump-machine-35-compact-case.png" alt="PM35" />
        <figcaption>PM35 — Compact case</figcaption>
        <p>Lipstick/compact motor, discreet personal</p>
      </figure>
      <figure>
        <img src="./pump-machine-36-all-in-one.png" alt="PM36" />
        <figcaption>PM36 — All-in-one bottle</figcaption>
        <p>Motor collar on bottle + flange on top</p>
      </figure>
      <figure>
        <img src="./pump-machine-37-charging-case.png" alt="PM37" />
        <figcaption>PM37 — Charging case</figcaption>
        <p>Earbud-case kit with personal pump pod</p>
      </figure>
      <figure>
        <img src="./pump-machine-38-keychain.png" alt="PM38" />
        <figcaption>PM38 — Keychain mini</figcaption>
        <p>Keyring fob + tiny flange silhouette</p>
      </figure>
    </div>
  </body>
</html>
