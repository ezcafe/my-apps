<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home pumping machine icons</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
        background: #f6f6f6;
        color: #111;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      .hint {
        font-size: 13px;
        color: #555;
        margin: 0 0 16px;
      }
      a {
        color: #0f766e;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
      }
      figure {
        margin: 0;
        padding: 16px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 12px;
        text-align: center;
      }
      img {
        width: 140px;
        height: 140px;
        object-fit: contain;
        background: #fff;
      }
      figcaption {
        margin-top: 12px;
        font-size: 14px;
        font-weight: 600;
      }
      p {
        margin: 6px 0 0;
        font-size: 12px;
        font-weight: 400;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>Home pumping machine icons — reply with PM19–PM28</h1>
    <p class="hint">
      At-home / domestic consumer pumps (bedside, kitchen, nursery).
      <a href="./machines.html">All machines PM1–18</a>
      ·
      <a href="./index.html">Bottle icons A–W</a>
    </p>
    <div class="grid">
      <figure>
        <img src="./pump-machine-19-bedside-speaker.png" alt="PM19" />
        <figcaption>PM19 — Bedside speaker</figcaption>
        <p>Soft rounded unit, LED row, big button</p>
      </figure>
      <figure>
        <img src="./pump-machine-20-countertop.png" alt="PM20" />
        <figcaption>PM20 — Countertop appliance</figcaption>
        <p>Blender-base dial, bottle docked on top</p>
      </figure>
      <figure>
        <img src="./pump-machine-21-tote.png" alt="PM21" />
        <figcaption>PM21 — Home tote</figcaption>
        <p>Tote bag with pump brick + hose peeking</p>
      </figure>
      <figure>
        <img src="./pump-machine-22-cushion.png" alt="PM22" />
        <figcaption>PM22 — Sofa cushion pump</figcaption>
        <p>Pillow-shaped motor for lounge use</p>
      </figure>
      <figure>
        <img src="./pump-machine-23-lamp.png" alt="PM23" />
        <figcaption>PM23 — Bedroom lamp</figcaption>
        <p>Dome night-light base with hose</p>
      </figure>
      <figure>
        <img src="./pump-machine-24-drawer-mini.png" alt="PM24" />
        <figcaption>PM24 — Drawer mini</figcaption>
        <p>Flat wallet pump, USB, tiny hose</p>
      </figure>
      <figure>
        <img src="./pump-machine-25-fridge.png" alt="PM25" />
        <figcaption>PM25 — Fridge hang</figcaption>
        <p>Pump on fridge outline, bottle dangling</p>
      </figure>
      <figure>
        <img src="./pump-machine-26-nursery-table.png" alt="PM26" />
        <figcaption>PM26 — Nursery side table</figcaption>
        <p>Pump box on side table + flange</p>
      </figure>
      <figure>
        <img src="./pump-machine-27-coffee-station.png" alt="PM27" />
        <figcaption>PM27 — Kitchen station</figcaption>
        <p>Coffee-maker style dual bottle docks</p>
      </figure>
      <figure>
        <img src="./pump-machine-28-lounge-oval.png" alt="PM28" />
        <figcaption>PM28 — Lounge oval</figcaption>
        <p>Friendly oval body + heart, hose + bottle</p>
      </figure>
    </div>
  </body>
</html>
