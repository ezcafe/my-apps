services:
  db:
    image: postgres:latest
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c track_io_timing=on
      -c log_min_duration_statement=500
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=16MB
      -c max_connections=100
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-money}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-money}
      POSTGRES_DB: ${POSTGRES_DB:-money}
    # postgres:18+ — mount parent dir only (see https://github.com/docker-library/postgres/pull/1259).
    volumes:
      - money_pg_data:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    ports:
      - "6432:5432"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-money}:${POSTGRES_PASSWORD:-money}@db:5432/${POSTGRES_DB:-money}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      ADMIN_USERS: ${POSTGRES_USER:-money}
      AUTH_TYPE: plain
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://${POSTGRES_USER:-money}:${POSTGRES_PASSWORD:-money}@pgbouncer:5432/${POSTGRES_DB:-money}}
    depends_on:
      pgbouncer:
        condition: service_started
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # Override host-oriented DATABASE_URL from .env for in-compose networking.
      # Local Compose keeps the owner role through PgBouncer (single-user auth).
      # Production should use `money_app` (no BYPASSRLS); see docs/API.md.
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://${POSTGRES_USER:-money}:${POSTGRES_PASSWORD:-money}@pgbouncer:5432/${POSTGRES_DB:-money}}
      PG_STARTUP_TIMEOUTS: "0"
      # Public URL must match the browser origin (Cloudflare Tunnel hostname, not localhost).
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      # Required at runtime — Compose fails fast if missing from `.env` / `--env-file`.
      # Middleware loads auth on /money; without this Safari may prompt to “allow downloads”.
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env — e.g. openssl rand -base64 32}
      AUTH_POCKET_ID_ISSUER: ${AUTH_POCKET_ID_ISSUER:?Set AUTH_POCKET_ID_ISSUER in .env}
      AUTH_POCKET_ID_ID: ${AUTH_POCKET_ID_ID:?Set AUTH_POCKET_ID_ID in .env}
      AUTH_POCKET_ID_SECRET: ${AUTH_POCKET_ID_SECRET:?Set AUTH_POCKET_ID_SECRET in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  money_pg_data:
